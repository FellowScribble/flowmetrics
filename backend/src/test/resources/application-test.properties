# ==========================
# Perfil "test" — aísla los tests en la BD de pruebas
# ==========================
# Regla dura: los tests NO deben tocar la BD de desarrollo `flowmetrics`.
# Se sobrescribe ÚNICAMENTE la URL; el usuario y la contraseña se heredan de
# `src/main/resources/application.properties`, que ahora los toma de variables de
# entorno (DB_USERNAME / DB_PASSWORD). No se duplican credenciales aquí: para
# ejecutar los tests debes exportar esas variables igual que para la app.
spring.datasource.url=jdbc:postgresql://localhost:5432/flowmetrics_test

# El esquema de `flowmetrics_test` se provisiona con el esquema real (pg_dump --schema-only
# desde `flowmetrics`), por lo que se valida contra las entidades igual que en producción.
spring.jpa.hibernate.ddl-auto=validate

# Silenciar el SQL y no dejar que Flyway actúe (mismo comportamiento que el perfil por defecto).
spring.jpa.show-sql=false
spring.flyway.enabled=false
