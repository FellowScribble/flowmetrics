# ==========================================================================
# Perfil "prod" — despliegue (Render + Neon PostgreSQL)
# ==========================================================================
# Actívalo en Render con: SPRING_PROFILES_ACTIVE=prod
#
# IMPORTANTE: este perfil NO hereda el baseline del perfil `flyway` local
# (baseline-on-migrate=true / baseline-version=2). La base de datos de producción
# (Neon) está VACÍA: Flyway debe crear el esquema y la semilla desde cero
# aplicando V1 (esquema), V2 (plantilla demo) y V3+ en orden.
#   - No se define baseline-on-migrate (queda en su valor por defecto: false).
#   - No se define baseline-version.
# Si algún día se apunta a una base YA existente, esto fallará a propósito
# (evita marcar/omitir migraciones de forma silenciosa): no copiar aquí el
# baseline del entorno local.
# ==========================================================================

# Flyway activo en producción para inicializar una base vacía.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

# Logs de SQL fuera de producción (menos ruido y menos datos en los registros).
spring.jpa.show-sql=false

# Render inyecta el puerto a escuchar en la variable PORT.
server.port=${PORT:8080}

# HTTPS: la cookie de demo se marca Secure. Se mantienen HttpOnly y SameSite=Lax
# (compatibles con el proxy same-origin de Vercel).
app.demo.cookie.secure=true

# El endpoint manual POST /api/demo/cleanup queda deshabilitado en producción
# (responde 404). La limpieza de sesiones caducadas sigue funcionando por el
# @Scheduled horario (DemoCleanupServiceImpl), que no depende de esta propiedad.
app.demo.cleanup.endpoint.enabled=false
