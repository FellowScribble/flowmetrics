# ==========================================================================
# Perfil "flyway" — ACTIVACIÓN de Flyway (NO se activa por defecto)
# ==========================================================================
# Este perfil NO se carga en el arranque habitual: `spring.flyway.enabled` sigue
# en `false` en `application.properties`. Sirve como interruptor explícito para
# activar Flyway cuando se autorice.
#
# Cómo activarlo (una sola vez, cuando se decida):
#   SPRING_PROFILES_ACTIVE=flyway ./mvnw spring-boot:run
#   # o en Eclipse: Run Configurations -> Environment -> SPRING_PROFILES_ACTIVE=flyway
#   # o empaquetado: java -jar backend.jar --spring.profiles.active=flyway
#
# Estrategia de baseline (ver docs/base-datos.md y D-36):
#   - Base NUEVA / vacía: Flyway aplica V1 (esquema) y V2 (semilla demo) desde cero.
#     (Se verificó que baseline-on-migrate NO añade baseline a un esquema vacío.)
#   - Base EXISTENTE (no vacía, sin flyway_schema_history): se marca con un baseline
#     en la versión 2 SIN reejecutar V1/V2 (no recrea tablas ni duplica la semilla).
#   - Base YA gestionada por Flyway: solo aplica migraciones nuevas (V3+).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
