spring.application.name=backend

# ==========================
# PostgreSQL
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowmetrics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Flyway
# ==========================
# DESACTIVADO en el arranque habitual (activación pendiente de autorización).
# El mecanismo de activación aislado es el perfil `flyway`
# (`application-flyway.properties`): SPRING_PROFILES_ACTIVE=flyway.
# Estrategia de baseline y verificación: docs/base-datos.md y D-36.
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# ==========================
# Errores HTTP (no filtrar información interna)
# ==========================
# DevTools activa por defecto include-stacktrace/message/binding-errors=always
# en local (META-INF/spring-devtools.properties de spring-boot-autoconfigure).
# Fijamos estos valores para que local y producción se comporten igual.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# ==========================
# Healthcheck (Render)
# ==========================
# Expone ÚNICAMENTE /actuator/health. No se publican metrics, env, configprops, etc.
# Sin Spring Security en el proyecto: el endpoint de salud es público por diseño
# (Render necesita consultarlo sin credenciales). No revela detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ==========================
# CORS y cookie de demo (configurables por entorno)
# ==========================
# Orígenes permitidos (lista separada por comas). En producción con el proxy de
# Vercel el navegador solo habla con el dominio del frontend (mismo origen), por lo
# que CORS no se ejerce; se mantiene configurable para acceso directo/pruebas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Marca Secure de la cookie de sesión de demo. En local es HTTP -> false por defecto;
# el perfil `prod` la activa (HTTPS). No cambia HttpOnly ni SameSite.
app.demo.cookie.secure=${DEMO_COOKIE_SECURE:false}